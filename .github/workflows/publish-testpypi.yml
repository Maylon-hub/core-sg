name: Publish to TestPyPI

on:
  push:
    tags:
      - "v*rc*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/core-sg

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Wait for package to become available
        run: sleep 120

      - name: Installing Scikit-Learn
        run: python -m pip install scikit-learn

      - name: Installing hdbscan
        run: python -m pip install hdbscan

      - name: Installing pandas
        run: python -m pip install pandas

      - name: Installing numpy
        run: python -m pip install numpy

      - name: Install published package from TestPyPI
        run: python -m pip install -i https://test.pypi.org/simple/ core-sg==${GITHUB_REF_NAME#v}

      - name: Run smoke test
        run: |
          python - <<'PY'
          from sklearn.datasets import make_blobs
          from core_sg import CoreSG

          X, _ = make_blobs(
              n_samples=500,
              n_features=3,
              centers=3,
              random_state=42,
          )

          core = CoreSG(metric="euclidean", p=2)
          core.fit(X, k_max=5)
          mst = core.extract_mst_from_core_sg(k=3)

          assert mst is not None
          print("Smoke test passed.")
          PY