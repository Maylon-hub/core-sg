name: RC validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Build common CORE-SG sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist
          python -m twine check dist/*
          python scripts/check_artifacts.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  qualify:
    name: Qualify ${{ matrix.os }} / CPython 3.11
    timeout-minutes: 60
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: dist
      - name: Build sdist and supported native wheel
        run: |
          python -m pip install --upgrade pip build twine cibuildwheel==3.3.1
          python scripts/build_rc_artifacts.py . dist --reuse-sdist
          python -m twine check dist/*
          python scripts/check_artifacts.py dist
      - name: Fresh wheel and sdist venvs, native imports, pip check, full suites and smoke
        run: >-
          python scripts/qualify_artifacts.py --project core-sg
          --artifacts dist --output "${{ runner.temp }}/core-qualification"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ runner.os }}-py3.11
          path: |
            ${{ runner.temp }}/core-qualification/*.log
            ${{ runner.temp }}/core-qualification/*.xml
          if-no-files-found: warn
      - name: Upload machine-readable qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-summary-${{ runner.os }}-py3.11
          path: ${{ runner.temp }}/core-qualification/qualification.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error
