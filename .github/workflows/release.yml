name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}
      target: ${{ steps.evaluate.outputs.target }}
      version: ${{ steps.evaluate.outputs.version }}
      is_rc: ${{ steps.evaluate.outputs.is_rc }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate release context
        id: evaluate
        run: |
          git fetch --no-tags origin develop:refs/remotes/origin/develop

          version="${GITHUB_REF_NAME#v}"
          should_run="false"
          target="skip"
          is_rc="false"

          if [[ "${GITHUB_REF_NAME}" == *rc* ]]; then
            is_rc="true"
            release_target="testpypi"
          else
            release_target="pypi"
          fi

          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/develop; then
            should_run="true"
            target="${release_target}"
            echo "Tag ${GITHUB_REF_NAME} points to a commit contained in origin/develop."
          else
            echo "Tag ${GITHUB_REF_NAME} is not contained in origin/develop. Release jobs will be skipped."
          fi

          {
            echo "version=${version}"
            echo "should_run=${should_run}"
            echo "target=${target}"
            echo "is_rc=${is_rc}"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize release decision
        run: |
          {
            echo "## Release decision"
            echo ""
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- version: \`${{ steps.evaluate.outputs.version }}\`"
            echo "- target: \`${{ steps.evaluate.outputs.target }}\`"
            echo "- should run: \`${{ steps.evaluate.outputs.should_run }}\`"
            echo "- release candidate: \`${{ steps.evaluate.outputs.is_rc }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: release-context
    if: needs.release-context.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Validate package version
        env:
          EXPECTED_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["EXPECTED_VERSION"]
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]

          actual = project["version"]
          if actual != expected:
              raise SystemExit(
                  f"pyproject.toml version mismatch: expected {expected}, found {actual}"
              )

          print(f"Validated package version {actual}.")
          PY

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    needs: [release-context, build]
    if: needs.release-context.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/core-sg

    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  smoke-test-testpypi:
    needs: [release-context, publish-testpypi]
    if: needs.release-context.outputs.target == 'testpypi'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Wait for package to become available on TestPyPI
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            echo "Attempt ${attempt}: trying to install core-sg==${VERSION} from TestPyPI"
            if python -m pip install --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "core-sg==${VERSION}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Timed out waiting for core-sg==${VERSION} to become available on TestPyPI."
          exit 1

      - name: Run smoke test against TestPyPI package
        run: |
          python - <<'PY'
          from sklearn.datasets import make_blobs
          from core_sg import CoreSG

          X, _ = make_blobs(
              n_samples=500,
              n_features=3,
              centers=3,
              random_state=42,
          )

          core = CoreSG(metric="euclidean", p=2)
          core.fit(X, k_max=5)
          mst = core.extract_mst_from_core_sg(k=3)

          assert mst is not None
          print("Smoke test passed.")
          PY

  publish-pypi:
    needs: [release-context, build]
    if: needs.release-context.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/core-sg

    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test-pypi:
    needs: [release-context, publish-pypi]
    if: needs.release-context.outputs.target == 'pypi'
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Wait for package to become available on PyPI
        env:
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            echo "Attempt ${attempt}: trying to install core-sg==${VERSION} from PyPI"
            if python -m pip install --no-cache-dir "core-sg==${VERSION}"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Timed out waiting for core-sg==${VERSION} to become available on PyPI."
          exit 1

      - name: Run smoke test against PyPI package
        run: |
          python - <<'PY'
          from sklearn.datasets import make_blobs
          from core_sg import CoreSG

          X, _ = make_blobs(
              n_samples=500,
              n_features=3,
              centers=3,
              random_state=42,
          )

          core = CoreSG(metric="euclidean", p=2)
          core.fit(X, k_max=5)
          mst = core.extract_mst_from_core_sg(k=3)

          assert mst is not None
          print("Smoke test passed.")
          PY
