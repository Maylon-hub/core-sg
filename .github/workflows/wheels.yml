name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*rc*"
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip build cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: "x86_64 arm64"

      - name: Verify wheel contents
        run: |
          python -c "import glob, zipfile; [print(f) for f in glob.glob('wheelhouse/*.whl')]"
          python -c "
          import glob, zipfile
          for w in glob.glob('wheelhouse/*.whl'):
              with zipfile.ZipFile(w) as z:
                  names = z.namelist()
              assert any(n.endswith('.pyd') or n.endswith('.so') for n in names), f'Missing binary in {w}'
              print(f'OK: {w} contém binário compilado')
          "

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to TestPyPI
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/core-sg-mustache

    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
