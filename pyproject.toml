[build-system]
requires = [
  "setuptools>=77",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "core-sg"
version = "0.1.0rc12"
description = "Core-SG graph construction and MST extraction utilities for HDBSCAN-style clustering."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Midas Core-SG Team", email = "gmcorlando@estudante.ufscar.br" },
]
keywords = [
  "core-sg",
  "clustering",
  "hdbscan",
  "graph",
  "mst",
  "density-based-clustering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "hdbscan>=0.8.39",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.15.0",
  "build>=1.2.2",
  "twine>=5.1.0",
]

[project.urls]
Source = "https://github.com/midas-core-sg/core-sg"
Issues = "https://github.com/midas-core-sg/core-sg/issues"
Documentation = "https://github.com/midas-core-sg/core-sg#readme"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["core_sg", "core_sg.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: Fast tests that isolate a small unit of behavior with controlled doubles.",
  "integration: Tests that exercise the library against real external behavior or package boundaries.",
  "validation: Algorithmic equivalence and behavior-validation tests across multiple k values.",
  "slow: Tests that are intentionally heavier and may take longer to execute.",
]

[tool.coverage.run]
branch = true
source = ["core_sg"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/integration/test_reference_equivalence.py" = ["E402"]
"tests/validation/conftest.py" = ["E402"]
