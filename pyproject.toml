[build-system]
requires = [
  "cython>=3.0",
  "numpy>=1.24,<3",
  "setuptools>=77",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "core-sg-mustache"
version = "0.4.5rc3"
description = "Core-SG graph construction and MST extraction utilities for HDBSCAN-style clustering."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Midas Core-SG Team", email = "gmcorlando@estudante.ufscar.br" },
]
keywords = [
  "core-sg",
  "clustering",
  "hdbscan",
  "graph",
  "mst",
  "density-based-clustering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",

  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  # Native private tree API is release-qualified, not forward-compatible.
  "hdbscan==0.8.44",
  "pynndescent>=0.5.13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.15.0",
  "build>=1.2.2",
  "cibuildwheel>=2.20",
  "twine>=5.1.0",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "sphinx-autodoc-typehints>=2",
  "myst-parser>=2",
  "nbsphinx>=0.9",
  "ipython",
  "matplotlib",
  "pandas",
  "scikit-learn",
]

[project.urls]
Source = "https://github.com/Maylon-hub/core-sg"
Issues = "https://github.com/Maylon-hub/core-sg/issues"
Documentation = "https://midas-core-sg.github.io/core-sg/"
Changelog = "https://github.com/Maylon-hub/core-sg/blob/develop/CHANGELOG.md"

[tool.setuptools]
include-package-data = true
zip-safe = false
# ext-modules = [
#   {name = "core_sg._mst_kruskal", sources = ["core_sg/_mst_kruskal.pyx"]},
#   {name = "core_sg._reweight", sources = ["core_sg/_reweight.pyx"]},
# ]

[tool.setuptools.packages.find]
include = ["core_sg", "core_sg.*"]

[tool.setuptools.data-files]
"share/doc/core-sg-mustache" = ["CITATION.cff", "CHANGELOG.md", "AUTHORS.md", "AUTHORSHIP_APPROVAL_REQUIRED.md", "DATASETS.md", "RELEASE_NOTES.md", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.exclude-package-data]
core_sg = ["*.c", "*.h"]

[tool.cibuildwheel]
build = "cp311-win_amd64 cp311-manylinux_x86_64"
skip = ["*-musllinux_*", "*-macosx_*", "pp*"]
test-command = "python {project}/scripts/rc_smoke.py"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: Fast tests that isolate a small unit of behavior with controlled doubles.",
  "integration: Tests that exercise the library against real external behavior or package boundaries.",
  "validation: Algorithmic equivalence and behavior-validation tests across multiple k values.",
  "slow: Tests that are intentionally heavier and may take longer to execute.",
]

[tool.coverage.run]
branch = true
source = ["core_sg"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/integration/test_reference_equivalence.py" = ["E402"]
"tests/validation/conftest.py" = ["E402"]
